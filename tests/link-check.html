<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>链接提取诊断</title><body><h1>链接提取诊断</h1><p>仅调用私人提取函数，不保存或修改收藏。</p><label>原站链接<input id="url" type="url"></label><button id="check">检测链接</button><pre id="result" style="white-space:pre-wrap"></pre><script type="module">
import {importLink} from '../store.js?v=aff-age-20261110';
document.querySelector('#check').onclick=async()=>{const out=document.querySelector('#result');out.textContent='检测中…';try{const r=await importLink(document.querySelector('#url').value,{confirmAge:true}),d=new DOMParser().parseFromString(r.html,'text/html');out.textContent=JSON.stringify({url:r.url,title:d.title,size:r.html.length,bodyLength:d.body.textContent.length,headings:[...d.querySelectorAll('h1,h2')].map(e=>e.textContent.slice(0,100)),roots:[...d.querySelectorAll('#user-submitted-body,#storytext,#story-text,.story-content,.chapter-content')].map(e=>({tag:e.tagName,id:e.id,class:e.className,length:e.textContent.length,markup:e.outerHTML.slice(0,1200)})),scripts:[...d.scripts].map(s=>({src:s.src,text:s.textContent.slice(0,1000)})),start:d.body.textContent.trim().slice(0,350)},null,2)}catch(e){out.textContent=e.message}};
</script></body></html>
