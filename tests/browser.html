<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>藏页浏览器解析测试</title><body><h1>浏览器解析测试</h1><pre id="result">运行中…</pre><script src="../vendor/jszip.min.js"></script><script type="module">
import {extractHTML,parseEPUB,parseFile} from '../importer.js?v=formats-20261025';
import {textPDF,emptyPDF} from './pdf-fixture.js';
const results=[];const check=(v,m)=>{if(!v)throw new Error(m)};const test=async(name,fn)=>{try{await fn();results.push('PASS '+name)}catch(e){results.push('FAIL '+name+': '+e.message)}};
await test('AO3 多章节提取、标题作者、末段保留',()=>{const w=extractHTML('<h2 class="title">测试作品</h2><a rel="author">测试作者</a><div id="chapters"><div class="chapter"><h3 class="title">第一章</h3><div class="userstuff">'+('第一章正文。'.repeat(20))+'</div></div><div class="chapter"><h3 class="title">第二章</h3><div class="userstuff"><p>第二章正文。</p><p>最后一段，完整保留。</p></div></div></div>','https://archiveofourown.org/works/123');check(w.chapters.length===2,'章节数错误');check(w.title==='测试作品'&&w.author==='测试作者','元数据错误');check(w.chapters[1].text.endsWith('最后一段，完整保留。'),'末段丢失')});
await test('登录页不会作为全文保存',()=>{let failed=false;try{extractHTML('<html><title>登录</title><form>用户名 密码 登录</form></html>','https://m.weibo.cn/status/123')}catch{failed=true}check(failed,'登录页被误存')});
await test('HTML 导入不会执行脚本，正文剔除脚本',()=>{const w=extractHTML('<article><h1>标题</h1><p>正文</p><script>window.__unsafe=true;<\/script><iframe src="https://example.com"></iframe><p>结尾</p></article>');check(!window.__unsafe,'执行了脚本');check(!w.chapters[0].text.includes('__unsafe'),'脚本混入正文');check(w.chapters[0].text.includes('结尾'),'正文丢失')});
await test('EPUB 按 spine 顺序导入，不依赖文件排序',async()=>{const z=new JSZip();z.file('mimetype','application/epub+zip');z.file('META-INF/container.xml','<container><rootfiles><rootfile full-path="OEBPS/book.opf"/></rootfiles></container>');z.file('OEBPS/book.opf','<package xmlns:dc="http://purl.org/dc/elements/1.1/"><metadata><dc:title>EPUB测试</dc:title><dc:creator>作者甲</dc:creator></metadata><manifest><item id="a" href="a.xhtml"/><item id="b" href="b.xhtml"/></manifest><spine><itemref idref="b"/><itemref idref="a"/></spine></package>');z.file('OEBPS/a.xhtml','<html><body><h1>第二章</h1><p>最后一句。</p></body></html>');z.file('OEBPS/b.xhtml','<html><body><h1>第一章</h1><p>开始。</p></body></html>');const b=await z.generateAsync({type:'arraybuffer'});const w=await parseEPUB(b,'test.epub');check(w.title==='EPUB测试'&&w.author==='作者甲','元数据错误');check(w.chapters.length===2&&w.chapters[0].title==='第一章','阅读顺序错误');check(w.chapters[1].text.includes('最后一句。'),'结尾丢失')});
await test('HTML 文件批量入口返回独立正文',async()=>{const w=await parseFile(new File(['<html><title>手动保存</title><body><p>私人正文。</p></body></html>'],'saved.html',{type:'text/html'}));check(w.title==='手动保存'&&w.chapters[0].text.includes('私人正文'),'未保存全文')});
await test('DOCX 标题作者、表格、章节和末段',async()=>{const z=new JSZip();z.file('word/document.xml','<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>第一章 开始</w:t></w:r></w:p><w:p><w:r><w:t>正文一。</w:t></w:r></w:p><w:tbl><w:tr><w:tc><w:p><w:r><w:t>表格文字。</w:t></w:r></w:p></w:tc></w:tr></w:tbl><w:p><w:r><w:t>第二章 结尾</w:t></w:r></w:p><w:p><w:r><w:t>最后一段。</w:t></w:r></w:p></w:body></w:document>');z.file('docProps/core.xml','<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>DOCX测试</dc:title><dc:creator>作者甲</dc:creator></cp:coreProperties>');const w=await parseFile(new File([await z.generateAsync({type:'uint8array'})],'test.docx'));check(w.title==='DOCX测试'&&w.author==='作者甲','元数据错误');check(w.chapters.length===2&&w.chapters[0].text.includes('表格文字。'),'章节/表格丢失');check(w.chapters[1].text==='最后一段。','末段错误')});
await test('ODT 正文与元数据',async()=>{const z=new JSZip();z.file('content.xml','<office:document-content xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0"><office:body><office:text><text:h>第一章 开始</text:h><text:p>正文。<text:line-break/>下一行。</text:p><text:h>第二章 结尾</text:h><text:p>ODT最后一段。</text:p></office:text></office:body></office:document-content>');z.file('meta.xml','<meta xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>ODT测试</dc:title></meta>');const w=await parseFile(new File([await z.generateAsync({type:'uint8array'})],'test.odt'));check(w.title==='ODT测试'&&w.chapters.length===2,'元数据/章节错误');check(w.chapters[1].text==='ODT最后一段。','末段丢失')});
await test('FB2 嵌套章节不会漏掉外层正文',async()=>{const xml='<FictionBook xmlns="http://www.gribuser.ru/xml/fictionbook/2.0"><description><title-info><book-title>FB2测试</book-title><author><first-name>A</first-name><last-name>B</last-name></author></title-info></description><body><section><title><p>外层</p></title><p>外层前言。</p><section><title><p>第一章</p></title><p>内层正文。</p></section><p>FB2最后一段。</p></section></body></FictionBook>';const w=await parseFile(new File([xml],'test.fb2'));check(w.title==='FB2测试'&&w.author==='A B','元数据错误');const all=w.chapters.map(c=>c.text).join('\n');check(all.includes('外层前言。')&&all.includes('内层正文。')&&all.endsWith('FB2最后一段。'),'嵌套正文遗漏')});
await test('Markdown 正文、标题和原始标记',async()=>{const w=await parseFile(new File(['# 作品名\n## 第一章\n**正文**\n## 第二章\nMD最后一段。'],'test.md'));check(w.title==='作品名'&&w.chapters.length===2,'标题/章节错误');check(w.chapters[1].text==='MD最后一段。','末段丢失')});
await test('PDF worker 实际提取两页及元数据',async()=>{const bytes=Uint8Array.from(atob(textPDF),c=>c.charCodeAt(0));const w=await parseFile(new File([bytes],'test.pdf'));check(w.title==='PDF Import Fixture'&&w.author==='Import Tests','PDF元数据错误');check(w.chapters.length===2&&w.chapters[1].text.includes('Last paragraph complete.'),'PDF页数/末段错误')});
await test('无文字 PDF 明确拒绝，不保存空全文',async()=>{const bytes=Uint8Array.from(atob(emptyPDF),c=>c.charCodeAt(0));let failed=false;try{await parseFile(new File([bytes],'scan.pdf'))}catch(e){failed=/OCR|扫描/.test(e.message)}check(failed,'没有明确拒绝无文字PDF')});
await test('损坏 DOCX 与 XML 实体输入明确拒绝',async()=>{let count=0;try{await parseFile(new File([await new JSZip().generateAsync({type:'uint8array'})],'broken.docx'))}catch{count++}try{await parseFile(new File(['<!DOCTYPE a [<!ENTITY x "bad">]><FictionBook/>'],'bad.fb2'))}catch{count++}check(count===2,'坏文件未被拒绝')});
document.getElementById('result').textContent=results.join('\n')+'\n\n'+results.filter(x=>x.startsWith('PASS')).length+'/'+results.length+' passed';
</script></body></html>
