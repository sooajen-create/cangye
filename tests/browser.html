<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>藏页浏览器解析测试</title><body><h1>浏览器解析测试</h1><pre id="result">运行中…</pre><script src="../vendor/jszip.min.js"></script><script type="module">
import {extractHTML,parseEPUB,parseFile} from '../importer.js';
const results=[];const check=(v,m)=>{if(!v)throw new Error(m)};const test=async(name,fn)=>{try{await fn();results.push('PASS '+name)}catch(e){results.push('FAIL '+name+': '+e.message)}};
await test('AO3 多章节提取、标题作者、末段保留',()=>{const w=extractHTML('<h2 class="title">测试作品</h2><a rel="author">测试作者</a><div id="chapters"><div class="chapter"><h3 class="title">第一章</h3><div class="userstuff">'+('第一章正文。'.repeat(20))+'</div></div><div class="chapter"><h3 class="title">第二章</h3><div class="userstuff"><p>第二章正文。</p><p>最后一段，完整保留。</p></div></div></div>','https://archiveofourown.org/works/123');check(w.chapters.length===2,'章节数错误');check(w.title==='测试作品'&&w.author==='测试作者','元数据错误');check(w.chapters[1].text.endsWith('最后一段，完整保留。'),'末段丢失')});
await test('登录页不会作为全文保存',()=>{let failed=false;try{extractHTML('<html><title>登录</title><form>用户名 密码 登录</form></html>','https://m.weibo.cn/status/123')}catch{failed=true}check(failed,'登录页被误存')});
await test('HTML 导入不会执行脚本，正文剔除脚本',()=>{const w=extractHTML('<article><h1>标题</h1><p>正文</p><script>window.__unsafe=true;<\/script><iframe src="https://example.com"></iframe><p>结尾</p></article>');check(!window.__unsafe,'执行了脚本');check(!w.chapters[0].text.includes('__unsafe'),'脚本混入正文');check(w.chapters[0].text.includes('结尾'),'正文丢失')});
await test('EPUB 按 spine 顺序导入，不依赖文件排序',async()=>{const z=new JSZip();z.file('mimetype','application/epub+zip');z.file('META-INF/container.xml','<container><rootfiles><rootfile full-path="OEBPS/book.opf"/></rootfiles></container>');z.file('OEBPS/book.opf','<package xmlns:dc="http://purl.org/dc/elements/1.1/"><metadata><dc:title>EPUB测试</dc:title><dc:creator>作者甲</dc:creator></metadata><manifest><item id="a" href="a.xhtml"/><item id="b" href="b.xhtml"/></manifest><spine><itemref idref="b"/><itemref idref="a"/></spine></package>');z.file('OEBPS/a.xhtml','<html><body><h1>第二章</h1><p>最后一句。</p></body></html>');z.file('OEBPS/b.xhtml','<html><body><h1>第一章</h1><p>开始。</p></body></html>');const b=await z.generateAsync({type:'arraybuffer'});const w=await parseEPUB(b,'test.epub');check(w.title==='EPUB测试'&&w.author==='作者甲','元数据错误');check(w.chapters.length===2&&w.chapters[0].title==='第一章','阅读顺序错误');check(w.chapters[1].text.includes('最后一句。'),'结尾丢失')});
await test('HTML 文件批量入口返回独立正文',async()=>{const w=await parseFile(new File(['<html><title>手动保存</title><body><p>私人正文。</p></body></html>'],'saved.html',{type:'text/html'}));check(w.title==='手动保存'&&w.chapters[0].text.includes('私人正文'),'未保存全文')});
document.getElementById('result').textContent=results.join('\n')+'\n\n'+results.filter(x=>x.startsWith('PASS')).length+'/'+results.length+' passed';
</script></body></html>
